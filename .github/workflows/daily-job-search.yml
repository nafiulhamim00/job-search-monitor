name: Daily job search

on:
  schedule:
    # 07:00 UTC daily (~08:00/09:00 Norway time depending on DST)
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job monitor
        run: python job_monitor.py

      - name: Commit updated data + report
        run: |
          git config user.name "job-search-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/postings.json docs/index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Daily update: $(date -u +%Y-%m-%d)"
          git push
# trigger reindex
